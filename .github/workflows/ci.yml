name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: fitness_test, POSTGRES_USER: fitness, POSTGRES_PASSWORD: fitness }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fitness -d fitness_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - name: Install locked dependencies
        working-directory: fitness-platform/backend
        run: uv sync --extra dev --frozen
      - name: Ruff, mypy and tests
        working-directory: fitness-platform/backend
        run: |
          uv run ruff format --check . ../scripts
          uv run ruff check . ../scripts
          uv run mypy src
          uv run pytest
      - name: PostgreSQL migrations
        working-directory: fitness-platform/backend
        env:
          FITNESS_DATABASE_URL: postgresql+asyncpg://fitness:fitness@localhost:5432/fitness_test
          FITNESS_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Verify OpenAPI
        working-directory: fitness-platform
        run: backend/.venv/bin/python scripts/export_openapi.py && git diff --exit-code shared/openapi.json

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: JVM tests, formatting, analysis, lint and debug build
        working-directory: fitness-platform/android
        run: ./gradlew spotlessCheck detekt test lintDebug assembleDebug

  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python fitness-platform/scripts/check_repository.py
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - uses: gitleaks/gitleaks-action@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: fitness-platform/backend
          push: false
          tags: fitness-platform-backend:ci
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: fitness-platform
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
