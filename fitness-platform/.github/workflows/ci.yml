name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fitness_test
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --extra dev --frozen
      - name: Format, lint and type check
        working-directory: backend
        run: |
          uv run ruff format --check . ../scripts
          uv run ruff check . ../scripts
          uv run mypy src
      - name: Unit and API tests
        working-directory: backend
        run: uv run pytest
      - name: PostgreSQL migration check
        working-directory: backend
        env:
          FITNESS_DATABASE_URL: postgresql+asyncpg://fitness:fitness@localhost:5432/fitness_test
          FITNESS_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Export OpenAPI
        run: backend/.venv/bin/python scripts/export_openapi.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Dependency resolution and quality checks
        working-directory: android
        run: ./gradlew buildEnvironment spotlessCheck detekt lintDebug
      - name: Unit tests and debug build
        working-directory: android
        run: ./gradlew test assembleDebug

  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Documentation and repository integrity
        run: python scripts/check_repository.py
      - name: Pull-request dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python dependency audit
        run: |
          python -m pip install uv pip-audit
          cd backend
          uv export --frozen --no-dev --format requirements-txt --output-file requirements-audit.txt
          pip-audit -r requirements-audit.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: fitness-platform-backend:ci
      - name: Filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
